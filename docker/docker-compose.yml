version: '3.9'

services:
  site-generation:
    build: ../../site-generation
    expose:
      - "40400"
    restart: always
    depends_on:
      - postgres-elias-db

  postgres-elias-db:
    image: postgres:9
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    restart: always
    volumes:
      - postgres-db-elias:/data/db

  ollama-ai:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT}:11434"
    volumes:
      - data_classification_volume:/root/.ollama

volumes:
  postgres-db-elias:
