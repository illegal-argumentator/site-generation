version: '3.9'

services:
  site-generation:
    build: ../../site-generation
    ports:
      - "40400:8080"
    restart: always
    depends_on:
      - postgres-elias-db
      - ollama-ai

  postgres-elias-db:
    image: postgres:9
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    restart: always
    volumes:
      - elias-volume:/var/lib/postgresql/data

  ollama-ai:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT}:11434"
    volumes:
      - elias-volume:/root/.ollama

volumes:
  elias-volume:
